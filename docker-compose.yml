services:
  kanban-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-kanban
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/tasks.db
      - CLIENT_ORIGIN=*
    volumes:
      - kanban_db_data:/app/data

volumes:
  kanban_db_data:
    driver: local
